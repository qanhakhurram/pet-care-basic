<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Method</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#1b2a1f;
  color:white;
}

/* HEADER */
.header{
  text-align:center;
  padding:30px;
  background:linear-gradient(135deg,#2f4f2f,#5c4033);
}

/* CONTAINER */
.container{
  padding:30px;
  max-width:800px;
  margin:auto;
}

/* PAYMENT OPTIONS */
.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
  margin-top:20px;
}

.option{
  background:#2f3e2f;
  padding:20px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}

.option:hover{
  transform:scale(1.05);
  background:#3f5a3f;
}

/* BUTTON */
.pay-btn{
  margin-top:20px;
  padding:12px;
  width:100%;
  border:none;
  border-radius:20px;
  background:#a3d977;
  color:#1b2a1f;
  font-weight:bold;
  cursor:pointer;
}

/* BACK BUTTON */
.back-btn{
  margin-top:20px;
  display:inline-block;
  padding:10px 15px;
  background:#a3d977;
  color:#1b2a1f;
  text-decoration:none;
  border-radius:20px;
}

/* POPUP */
.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.popup-box{
  background:white;
  color:black;
  padding:30px;
  border-radius:12px;
  text-align:center;
}
.back-btn{
  display:inline-block;
  padding:10px 5px;   
  font-size:15px;
  background:#a3d977;
  color:#1b2a1f;
  text-decoration:none;
  border-radius:12px;
  width:120px;        
}
button{
  font-size:16px;
  padding:12px;
}
</style>
</head>

<body>

<div class="header">
  <h1>💳 Payment System</h1>
  <p>Select your preferred payment method</p>
</div>

<div class="container">

<h3>Choose Payment Method:</h3>
<div id="paymentDetails" style="margin-top:20px;"></div>

<div class="options">

<div class="option" onclick="window.location.href='jazzcash.html'">
  💰 JazzCash
</div>

<div class="option" onclick="window.location.href='easypaisa.html'">
  📱 EasyPaisa
</div>

<div class="option" onclick="window.location.href='PayPak.html'">
  💳 PayPak
</div>

<div class="option" onclick="window.location.href='card.html'">
  💳 Debit/Credit Card
</div>

<button class="pay-btn" onclick="payNow()">Pay Now</button>

<br>

<a href="index.html" class="back-btn"> ⬅Back to Home</a>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-box">
    <h2>✅ Payment Successful!</h2>
    <p>Your payment has been completed 🐾</p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script>

let method = "";

function selectMethod(m){
  method = m;
  alert("Selected: " + m);
}

function payNow(){
  if(method === ""){
    alert("Please select a payment method first!");
    return;
  }

  document.getElementById("popup").style.display="flex";
}

function closePopup(){
  document.getElementById("popup").style.display="none";
  window.location.href = "petcare.html.html";
}
function selectMethod(m){
  method = m;

  let box = document.getElementById("paymentDetails");

  if(m === "JazzCash"){
    box.innerHTML = `
      <div style="background:#2f3e2f; padding:20px; border-radius:12px;">
        <h3>💰 JazzCash Payment</h3>
        <p>Send payment to:</p>
        <b>0300-1234567</b>

        <input placeholder="Your JazzCash Number" required>
        <input placeholder="Transaction ID" required>
      </div>
    `;
  }

  else if(m === "EasyPaisa"){
    box.innerHTML = `
      <div style="background:#2f3e2f; padding:20px; border-radius:12px;">
        <h3>📱 EasyPaisa Payment</h3>
        <p>Send payment to:</p>
        <b>0311-9876543</b>

        <input placeholder="Your EasyPaisa Number" required>
        <input placeholder="Transaction ID" required>
      </div>
    `;
  }

  else if(m === "PayPak"){
    box.innerHTML = `
      <div style="background:#2f3e2f; padding:20px; border-radius:12px;">
        <h3>💳 PayPak Payment</h3>

        <input placeholder="Card Number" required>
        <input placeholder="Expiry Date" required>
        <input placeholder="CVV" required>
      </div>
    `;
  }

  else if(m === "Card Payment"){
    box.innerHTML = `
      <div style="background:#2f3e2f; padding:20px; border-radius:12px;">
        <h3>💳 Card Payment</h3>

        <input placeholder="Card Holder Name" required>
        <input placeholder="Card Number" required>
        <input placeholder="Expiry Date" required>
        <input placeholder="CVV" required>
      </div>
    `;
  }
}
function payNow(){

  let method = document.getElementById("method").value;
  let number = document.getElementById("userNumber").value;
  let amount = document.getElementById("amount").value;

  // validation
  if(method === "" || number === "" || amount === ""){
    alert("❌ Please fill all fields");
    return;
  }

  // ✅ SUCCESS MESSAGE
  alert("✅ Payment Done Successfully!");

  // form reset (optional but acha lagta hai)
  document.getElementById("method").value = "";
  document.getElementById("userNumber").value = "";
  document.getElementById("amount").value = "";

}
</script>

</body>
</html>
